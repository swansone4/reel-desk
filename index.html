<!-- The Reel Desk's online copy (reelkit/desk_pages.py). Everything in site.bin and m/ is AES-256-GCM encrypted; this
     page derives the key from the passphrase (PBKDF2-SHA256) and opens it in the browser. Nothing readable is on the server. -->
<style>
/* The online copy's own look: the desk's CRT terminal (reelkit/desk.py CSS, sent in site.bin, styles the pages once it's
   open). This covers what shows before and around them: the lock screen, dialogs, the viewer and the recorder. The fonts
   are bundled next to this page (fonts/, both OFL), so nothing loads from Google. */
@font-face{font-family:"JetBrains Mono";src:url(fonts/JetBrainsMono-Variable.woff2) format("woff2");font-weight:100 800;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/IBMPlexMono-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/IBMPlexMono-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root{color-scheme:dark;--g:#39ff7a;--g2:#2bbf5c;--g3:#1c7a3c;--sage:#6f9a78;--text:#94b99b;--hi:#dcf7e3;--amber:#ffd24a;--red:#ff6b5e;
--line:rgba(57,255,122,.14);--line2:rgba(57,255,122,.3);--glow:0 0 6px rgba(57,255,122,.5),0 0 16px rgba(57,255,122,.16);
--mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
--body:"IBM Plex Mono","JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
html{background:#000}
body{margin:0;background:transparent;font:14px/1.6 var(--body);color:var(--text);-webkit-text-size-adjust:100%}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
background:radial-gradient(70vmax 45vmax at 12% -8%,rgba(57,255,122,.1),transparent 62%),
radial-gradient(60vmax 40vmax at 100% 108%,rgba(57,255,122,.07),transparent 60%),#000}
body:after{content:"";position:fixed;inset:0;z-index:7;pointer-events:none;
background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 3px)}
::selection{background:var(--g);color:#000}
button,input,textarea{font-family:var(--mono)}
button{display:inline-block;font:600 13px/1.25 var(--mono);color:var(--g);background:rgba(57,255,122,.06);border:1px solid var(--g2);
border-radius:3px;padding:8px 14px;cursor:pointer;-webkit-appearance:none;appearance:none}

button:disabled{opacity:.42;cursor:default;background:transparent;color:var(--g2);box-shadow:none}
input[type=checkbox],input[type=range]{accent-color:var(--g)}
.tb{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#06140b;border-bottom:1px solid var(--line2);font:500 13px var(--mono);color:var(--sage)}

background:linear-gradient(rgba(5,16,9,.95),rgba(2,8,4,.97));box-shadow:0 0 0 1px #000,0 0 46px rgba(57,255,122,.09)}
#lock form{padding:14px 18px 16px}#lock p{margin:9px 0}

border-radius:3px;caret-color:var(--g)}
#pw:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 1px var(--g),0 0 14px rgba(57,255,122,.25)}

flex-direction:column;align-items:center;justify-content:center;font:13px var(--mono);color:var(--text)}

#askbox{background:linear-gradient(rgba(5,16,9,.98),rgba(2,8,4,.99));border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin:60px 12px;
max-width:460px;width:100%;box-sizing:border-box;font:14px var(--body);box-shadow:0 0 0 1px #000,0 0 40px rgba(57,255,122,.12)}

font:600 13px var(--mono);color:var(--g);text-shadow:var(--glow)}

#askbox .in{padding:10px 14px 14px}#askbox label{display:block;margin:10px 0 4px;font:600 12px var(--mono);color:var(--g2)}
#askbox textarea{height:96px}

overflow:hidden;margin:6px 0}#upvid{max-width:220px;max-height:220px;transition:transform .2s}
.chips button{margin:2px 4px 2px 0;padding:6px 10px}.chips button.sel{background:var(--g);color:#000;border-color:var(--g)}
/* the recorder: full screen over the camera (above the scanlines, so the picture is as filmed), big targets for a thumb */
#rec{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:10;display:none;color:var(--hi);overflow:hidden;

#rec button:hover,#recreview button:hover{background:var(--g);color:#000}

#rec.on #recclock:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff3b30;margin-right:7px;box-shadow:0 0 8px #ff3b30}
#recprompt{position:absolute;left:10px;right:10px;top:calc(56px + env(safe-area-inset-top));height:31vh;overflow-y:auto;
background:rgba(0,4,1,.58);border:1px solid rgba(57,255,122,.38);padding:10px 14px;font:500 24px/1.38 var(--body);color:#eefcf1;display:none;
-webkit-overflow-scrolling:touch;box-sizing:border-box}
#recprompt p{margin:0 0 .55em}#recprompt:after{content:"";display:block;height:28vh}
#recbar{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;padding-bottom:max(16px,env(safe-area-inset-bottom));
background:linear-gradient(transparent,rgba(0,0,0,.72))}
#rectakes{display:flex;gap:6px;overflow-x:auto;min-height:36px;margin-bottom:10px}#rectakes button{flex:none;padding:6px 10px}

#recctl>span:last-child{justify-content:flex-end}

box-shadow:0 0 16px rgba(57,255,122,.45)}
#recgo:after{content:"";position:absolute;left:6px;top:6px;right:6px;bottom:6px;border-radius:50%;background:#ff3b30;transition:all .15s}

padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));-webkit-user-select:text;user-select:text}
#recreview h3,#recsheet h3{font:600 16px var(--mono);margin:4px 0 10px;color:var(--g);text-shadow:var(--glow)}
#recreview h3:before,#recsheet h3:before{content:"$ ";color:var(--g2);text-shadow:none}
#recreview textarea,#recsheet textarea{width:100%;box-sizing:border-box;min-height:90px;background:#010703;color:var(--hi);border:1px solid var(--line2);
border-radius:3px;font:15px var(--body);padding:8px;margin:8px 0;caret-color:var(--g)}
#recsheet textarea{min-height:42vh}
.take{border-top:1px dashed var(--line2);padding:12px 0}.take b{color:var(--g)}.take .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.takeview{width:min(84vw,42vh);height:min(84vw,42vh);margin:8px auto;display:flex;align-items:center;justify-content:center;background:#010703;
border:1px solid var(--line);overflow:hidden}
.takeview video{max-width:100%;max-height:100%;transition:transform .2s}
.take input[type=range]{width:100%;margin:4px 0 8px;accent-color:var(--g)}.rsmall{font-size:12.5px;color:var(--sage)}
#recreview .chips button.sel,#recsheet .chips button.sel{background:var(--g);color:#000}
#recreview .send{background:var(--g);color:#000;font-weight:700;padding:12px 18px;margin-top:6px;box-shadow:0 0 14px rgba(57,255,122,.35)}
@media (max-width:480px){#lock{margin:10vh 12px 24px}}

</style></head><body>
<div id="lock" style="display:none"><div class="tb"><span>eric@reel-desk:<b>~/unlock</b></span></div><form id="form">
<p class="ps"><span>$</span> ./open --passphrase</p>
<p><label for="pw" class="note">Passphrase</label><br><input type="password" id="pw" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"></p>
<p><label><input type="checkbox" id="keep" checked> Remember on this device</label></p>
<p><button type="submit" id="go">Open</button> <span id="msg" class="note"></span></p>
<p class="note">Your desk is encrypted. It opens here, on this device: the passphrase never leaves it.</p></form></div>
<div id="app"></div>
<div id="viewer"><div id="vbox"></div><div><a href="#" id="vsave">Save</a><a href="#" id="vclose">Close</a></div></div>
<div id="ask"><div id="askbox"></div></div>
<script>
"use strict";
const SALT = "7c2b78ea2a242cf67c959d4870e0e413", ITER = 600000, BUILD = "ca40a0e83511", KEEP = "reeldesk-key-" + SALT;
const $ = id => document.getElementById(id);
const unhex = s => new Uint8Array(s.match(/../g).map(h => parseInt(h, 16)));
const tohex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
let KEY = null, B = null;
const blobs = new Map();

function store(op, v) { try { return op === "get" ? localStorage.getItem(KEEP) : op === "set" ? localStorage.setItem(KEEP, v) : localStorage.removeItem(KEEP); } catch (e) { return null; } }
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.trim().normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: unhex(SALT), iterations: ITER, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
const decrypt = buf => crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, KEY, buf.slice(12));
async function gunzip(buf) { return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); }
async function load() {
  const r = await fetch("site.bin?b=" + BUILD, { cache: "no-cache" });
  if (!r.ok) throw new Error("The desk didn't load (" + r.status + "). Try again in a minute.");
  B = JSON.parse(await gunzip(await decrypt(await r.arrayBuffer())));
  await loadDesk();
}
// The phone link changes when the PC sleeps; desk.bin always has the latest, published in seconds. The newer of it and
// the link inside site.bin wins (a copy published before desk.bin existed has no "t": its own link stands).
let DESK_T = 0;
async function loadDesk() {
  try {
    const r = await fetch("desk.bin?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return false;
    const d = JSON.parse(new TextDecoder().decode(await decrypt(await r.arrayBuffer())));
    if (!B.t || !d || !("desk" in d) || (d.t || 0) < Math.max(B.t, DESK_T)) return false;
    DESK_T = d.t;
    if (JSON.stringify(d.desk) === JSON.stringify(B.desk)) return false;
    B.desk = d.desk; SIGNER = null;
    return true;
  } catch (e) { return false; }
}
function showLock(text) {
  $("app").innerHTML = ""; $("lock").style.display = "block";
  $("msg").textContent = text || ""; $("msg").className = text ? "err" : "note"; $("go").disabled = false; $("pw").focus();
}
$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  $("go").disabled = true; $("msg").className = "note"; $("msg").textContent = "Opening...";
  try {
    KEY = await derive($("pw").value); await load();
    if ($("keep").checked) store("set", tohex(await crypto.subtle.exportKey("raw", KEY)));
    $("pw").value = ""; start();
  } catch (e) {
    KEY = null; showLock(e.name === "OperationError" ? "That passphrase didn't open it." : e.message);
  }
});

// ---- the desk, page by page (#/ is Ideas, #/jobs, #/job/<id>, #/idea/<id>/read ...)
function route() { return decodeURIComponent(location.hash.slice(1)) || "/"; }
function start() {
  $("lock").style.display = "none";
  if (!$("deskcss")) { const s = document.createElement("style"); s.id = "deskcss"; s.textContent = B.css; document.head.append(s); }
  show();
  checkDesk();
  setInterval(checkDesk, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDesk(); });
}
// A page shows at once from the encrypted copy, then, while the desk is online, the live page from the desk replaces it
// (and active pages refresh by themselves). Offline, the copy is all there is.
const NOT_HERE = { t: "Not here", s: "", b: "<div id='win'><div id='top'><span class='path'>eric@reel-desk:<b>~</b></span></div><div id='page'><p>That page isn't in the online copy yet. It shows up here while your desk is " +
  "online, or within a few minutes in the copy. <a href='/'>Back to the ideas</a></p></div></div>" };
let SHOWN = { r: null, b: null, live: false };
function render(pg, keep) {
  const y = window.scrollY, app = $("app");
  document.title = pg.t; document.body.setAttribute("style", pg.s || "");
  app.innerHTML = pg.b;
  SHOWN = { r: route(), b: pg.b, live: !!pg.live };
  app.querySelectorAll("[data-at]").forEach(e => { e.textContent = pg.live ? "just now (live)" : B.at; });
  app.querySelectorAll("[data-gone]").forEach(e => {
    const n = document.createElement("span"); n.className = "gone";
    n.textContent = (e.textContent ? e.textContent + " " : "") + "(on your PC: opens here while it's on)"; e.replaceWith(n);
  });
  app.querySelectorAll("script").forEach(s => { const n = document.createElement("script"); n.textContent = s.textContent; s.replaceWith(n); });
  app.querySelectorAll("img[data-enc-src], img[data-live-src]").forEach(el => seen.observe(el));
  app.querySelectorAll("video[data-enc-src], video[data-live-src]").forEach(video);
  window.scrollTo(0, keep ? y : 0);
  paintDesk();
}
function show() {
  const r = route(), pg = B.routes[r] || B.routes[r.split("?")[0]];
  render(pg || { t: "Reel Desk", s: "", b: "<div id='win'><div id='top'><span class='path'>eric@reel-desk:<b>~</b></span></div><div id='page'><p class='small'>Loading from your desk...</p></div></div>" }, false);
  freshen(r, !pg);
}
function busyHere() {  // don't swap the page under someone: a playing video, the viewer, a dialog, typing, an upload
  return [...$("app").querySelectorAll("video")].some(v => !v.paused) || $("viewer").style.display === "flex" ||
    $("ask").style.display === "flex" || $("app").contains(document.activeElement) && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) ||
    route().startsWith("/new");
}
async function freshen(r, missing) {
  if (!ONLINE || !B.desk) { if (missing && ONLINE === false) render(NOT_HERE, false); return; }
  try {
    const pg = await call("/up/page?r=" + encodeURIComponent(r), { timeout: 20000 });
    if (route() !== r) return;
    if (pg.b === SHOWN.b) {  // nothing changed: it's live as it is
      SHOWN.live = true;
      $("app").querySelectorAll("[data-at]").forEach(e => { e.textContent = "just now (live)"; });
      return;
    }
    if (missing || !busyHere()) render(Object.assign(pg, { live: true }), !missing);
  } catch (e) { if (missing) render(NOT_HERE, false); }
}
setInterval(() => {  // job pages, and any page showing something under way (data-busy), refresh every 8 s; the rest every 45 s
  if (!B || !ONLINE || document.hidden) return;
  const r = route(), jobsy = r === "/jobs" || r.startsWith("/job/") || !!$("app").querySelector("[data-busy]");
  if (jobsy || Date.now() % 45000 < 8000) freshen(r, false);
}, 8000);
window.addEventListener("hashchange", () => { if (B) show(); });
document.addEventListener("click", ev => {
  const a = ev.target.closest && ev.target.closest("a");
  if (!a || !B) return;
  if (a.hasAttribute("data-lock")) { ev.preventDefault(); store("del"); location.hash = ""; location.reload(); return; }
  if (a.dataset.encHref) { ev.preventDefault(); view(a.dataset.encHref); return; }
  if (a.dataset.liveHref) { ev.preventDefault(); view(a.dataset.liveHref, true); return; }
  if (a.dataset.req) { ev.preventDefault(); request(a); return; }
  const h = a.getAttribute("href") || "";
  if (h.startsWith("/") && !h.startsWith("//")) {
    ev.preventDefault();
    if (a.target === "_blank") window.open("#" + h, "_blank"); else location.hash = h;
  }
});
document.addEventListener("submit", ev => {
  if ($("app").contains(ev.target)) { ev.preventDefault(); alert("That works on the desk at home."); }
});

// ---- images and videos: from the encrypted copy (decrypted on this device), or live from the desk, when they're needed
const TYPES = { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", gif: "image/gif", webp: "image/webp", mp4: "video/mp4",
  webm: "video/webm", mov: "video/quicktime", srt: "text/plain", md: "text/plain", txt: "text/plain" };
function metaOf(path, live) {
  if (!live) return B.assets[path];
  const name = decodeURIComponent(path.split("?")[0].split("/").pop());
  return { n: name, t: TYPES[(name.split(".").pop() || "").toLowerCase()] || "application/octet-stream" };
}
// Where a file comes from, quickest first: the encrypted copy on GitHub when it has this very file (GitHub's servers are
// fast; this PC uploads at about 0.3 MB/s), else live from the desk. Live videos stream through a signed link, so they
// play while they load and save through the phone's own download manager; nothing waits for a whole video in silence.
function source(path, live) {
  const bare = path.split("?")[0], q = new URLSearchParams(path.split("?")[1] || ""), z = +(q.get("z") || 0), a = B.assets[bare];
  if (!live) return { enc: path, size: (B.assets[path] || {}).z || 0 };
  if (a && (!z || a.z === z)) return { enc: bare, size: a.z };
  return { live: bare, size: z };
}
let SIGNER = null;
async function signed(path, dl) {  // a link that's good for 6 hours, for this one file; the token itself never goes in a URL
  if (!SIGNER) SIGNER = await crypto.subtle.importKey("raw", new TextEncoder().encode(B.desk.token), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const e = Math.floor(Date.now() / 1000) + 6 * 3600;
  const s = tohex(await crypto.subtle.sign("HMAC", SIGNER, new TextEncoder().encode(path + "|" + e)));
  return B.desk.url + "/up/v?p=" + encodeURIComponent(path) + "&e=" + e + "&s=" + s + (dl ? "&dl=1" : "");
}
async function bytes(url, opts, onp) {  // a download, with progress as it comes in
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error("couldn't load it (" + r.status + ")");
  const total = +r.headers.get("Content-Length") || 0;
  if (!r.body || !onp) return new Uint8Array(await r.arrayBuffer());
  const reader = r.body.getReader(), parts = [];
  let n = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value); n += value.length; onp(n, total);
  }
  const out = new Uint8Array(n);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
function blobFor(path, live, onp) {
  const src = source(path, live), key = src.enc ? "enc:" + src.enc : "live:" + src.live;
  if (!blobs.has(key)) {
    blobs.set(key, (async () => {
      if (src.live) {
        const b = await bytes(B.desk.url + "/up/f?p=" + encodeURIComponent(src.live), { headers: { Authorization: "Bearer " + B.desk.token } }, onp);

async function recSend(b, msg) {
  const keep = REC.takes.filter(t => !t.gone && !t.up.dead);

  b.disabled = true; msg.textContent = "Sending...";
  try {
    for (const t of keep) { await recEnsure(t); if (t.up.t == null) throw new Error(t.up.err || "no connection to the desk"); }
    await call("/up/send?id=" + encodeURIComponent(REC.job), { method: "POST", json: { notes: REC.notes, speed: REC.speed, template: REC.look || "",
      takes: keep.map(t => ({ t: t.up.t, in: +t.a.toFixed(2), out: t.b == null ? null : +t.b.toFixed(2), rotate: t.rot, fill: t.fill })) } });
    REC.sent = true;
    const left = keep.filter(t => !t.up.done).length, id = REC.job;
    msg.textContent = left ? "Sent. The edit starts once the last " + (left > 1 ? left + " takes are" : "take is") + " up: keep this page open until then." : "Sent.";

}
